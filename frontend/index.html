<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rendszám lekérdező</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>Rendszám lekérdező</h1>
    <p>Írd be a rendszámot, és nézd meg, kihez tartozik.</p>
    <form id="lookup-form">
      <input id="plate-input" type="text" placeholder="Pl. ABC123" maxlength="10" autocomplete="off" />
      <button type="submit">Lekérdezés</button>
    </form>
    <div id="result" class="result"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
