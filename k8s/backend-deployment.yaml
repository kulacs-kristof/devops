apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rendszam-backend
  template:
    metadata:
      labels:
        app: rendszam-backend
    spec:
      containers:
        - name: backend
          image: rendszam-backend:latest
          ports:
            - containerPort: 3000
