name: CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate GHCR token
        run: |
          if [ -z "${{ secrets.GHCR_PAT }}" ]; then
            echo "ERROR: GHCR_PAT secret is not set."
            echo "Create a repository secret named GHCR_PAT with read:packages and write:packages permissions."
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rendszam-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rendszam-frontend:${{ github.sha }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > $HOME/.kube/config

      - name: Validate remote cluster access
        run: |
          echo "Configured cluster server:"
          kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}' || true
          if grep -q 'localhost:8080' $HOME/.kube/config; then
            echo "ERROR: KUBE_CONFIG_DATA points to localhost:8080, which is not accessible from GitHub Actions."
            echo "Please use a kubeconfig for a remotely accessible cluster."
            exit 1
          fi
          kubectl version --client
          kubectl cluster-info

      - name: Deploy to Kubernetes
        run: |
          kubectl apply --validate=false -f k8s/backend-deployment.yaml
          kubectl apply --validate=false -f k8s/backend-service.yaml
          kubectl apply --validate=false -f k8s/frontend-service.yaml
          kubectl apply --validate=false -f k8s/frontend-service.yaml
          kubectl apply --validate=false -f k8s/ingress.yaml
          kubectl set image deployment/backend-deployment backend=ghcr.io/${{ github.repository_owner }}/rendszam-backend:${{ github.sha }}
          kubectl set image deployment/frontend-deployment frontend=ghcr.io/${{ github.repository_owner }}/rendszam-frontend:${{ github.sha }}
